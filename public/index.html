<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suat Usta Tantuni — Menü</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Kapak (hero) -->
  <header class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-ic">
      <div class="masa-rozet">🍽️ Masa <span id="masaNo">-</span></div>
      <h1 class="marka">Suat Usta Tantuni</h1>
      <p class="slogan">Mersin'in efsane lezzeti — taze lavaş, bol malzeme</p>
      <a href="#menuAlani" class="hero-btn">Menüyü Keşfet ↓</a>
    </div>
  </header>

  <!-- Kategori geçiş şeridi -->
  <nav id="katNav" class="kat-nav"></nav>

  <main id="menuAlani" class="menu"></main>

  <footer class="alt-bilgi">
    <p>Afiyet olsun 🧡</p>
    <span>Suat Usta Tantuni · QR Sipariş</span>
  </footer>

  <!-- Geri sayım hapı (aktif sipariş süresi) -->
  <div id="sayacPill" class="sayac-pill" hidden>⏱ <span id="sayacMetin">1:30</span></div>

  <!-- Sepet butonu (logo) -->
  <button id="sepetBtn" class="sepet-fab" hidden>
    <span class="fab-ikon">🛒</span>
    <span class="fab-badge" id="sepetAdet">0</span>
  </button>

  <!-- Sepet / sipariş paneli -->
  <div id="sepetPanel" class="panel" hidden>
    <div class="panel-ic">
      <div class="panel-tutamac"></div>
      <div class="panel-baslik">
        <h2 id="panelBaslik">Sepetim</h2>
        <button id="kapatBtn" class="kapat">✕</button>
      </div>
      <div id="panelSayac" class="panel-sayac" hidden></div>
      <div id="sepetListe" class="sepet-liste"></div>
      <label class="not-alani">
        <span>📝 Sipariş notu (opsiyonel)</span>
        <textarea id="not" placeholder="Örn: Acılı olsun, ekmek az kızarsın..."></textarea>
      </label>
      <div class="panel-toplam">Toplam <strong><span id="panelToplam">0</span> ₺</strong></div>
      <button id="siparisVerBtn" class="siparis-btn">Siparişi Gönder</button>
      <button id="siparisIptalBtn" class="siparis-btn tehlike" hidden>Siparişi İptal Et</button>
    </div>
  </div>

  <!-- Toast bildirimi -->
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
