<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yönetim Girişi</title>
  <link rel="stylesheet" href="/admin/panel.css" />
</head>
<body>
  <div class="login-sayfa">
    <form class="login-kutu" id="form">
      <h1>🔐 Yönetim Paneli</h1>
      <p>Devam etmek için şifreyi girin.</p>
      <div class="login-hata" id="hata"></div>
      <input type="password" id="sifre" placeholder="Şifre" autocomplete="current-password" autofocus />
      <button type="submit">Giriş Yap</button>
    </form>
  </div>
  <script src="/admin/login.js"></script>
</body>
</html>
