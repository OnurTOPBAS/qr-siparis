<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satış Raporları</title>
  <link rel="stylesheet" href="/admin/panel.css" />
</head>
<body>
  <nav class="nav">
    <span class="marka">🍽️ Yönetim</span>
    <a href="/admin">🔔 Siparişler</a>
    <a href="/admin/gecmis">🕘 Geçmiş</a>
    <a href="/admin/kampanya">🔥 Kampanyalar</a>
    <a href="/admin/menu">📋 Menü</a>
    <a href="/admin/masalar">🪑 Masalar & QR</a>
    <a href="/admin/rapor" class="aktif">📊 Raporlar</a>
    <div class="sag">
      <button id="yenile" class="ses-btn">↻ Yenile</button>
      <button class="cikis" id="cikis">Çıkış</button>
    </div>
  </nav>

  <div class="sekmeler">
    <button class="sekme aktif" data-p="gunluk">Günlük (Bugün)</button>
    <button class="sekme" data-p="haftalik">Haftalık (Bu Hafta)</button>
    <button class="sekme" data-p="aylik">Aylık (Bu Ay)</button>
  </div>

  <main class="rapor-govde">
    <div class="ozet-kartlar">
      <div class="ozet-kart"><span class="ozet-baslik">Toplam Ciro</span><span class="ozet-deger" id="ciro">0 ₺</span></div>
      <div class="ozet-kart"><span class="ozet-baslik">Sipariş Sayısı</span><span class="ozet-deger" id="siparis">0</span></div>
      <div class="ozet-kart"><span class="ozet-baslik">Satılan Ürün Çeşidi</span><span class="ozet-deger" id="cesit">0</span></div>
    </div>

    <h2 class="tablo-baslik">Ürün Bazında Satış</h2>
    <table class="rapor-tablo">
      <thead><tr><th>#</th><th>Ürün</th><th class="sag">Adet</th><th class="sag">Ciro</th></tr></thead>
      <tbody id="tabloGovde"></tbody>
    </table>
    <div id="bosRapor" class="bos" hidden>Bu dönemde henüz satış yok.</div>
  </main>

  <script src="/admin/rapor.js"></script>
</body>
</html>
